<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunara — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-page">

  <!-- Left panel -->
  <div class="login-left">
    <div class="login-left-moon">🌙</div>
    <div class="login-left-title">Lunara</div>
    <div class="login-left-sub">See Beyond. Build Forward.</div>
  </div>

  <!-- Right panel -->
  <div class="login-right">

    <!-- Step 1: Avatar Picker -->
    <div id="step-picker" class="login-step show">
      <div id="avatarPickerBtn" class="avatar-circle" title="Click to sign in">🌙</div>
      <h2>Welcome back</h2>
      <p>Click the moon to sign in to Lunara</p>
      <div class="login-switch">
        New here? <a onclick="goStep('step-register')">Create an account</a>
      </div>
    </div>

    <!-- Step 2: Sign In -->
    <div id="step-signin" class="login-step">
      <h2>Sign in</h2>
      <p>Enter your email and password</p>
      <form id="signinForm">
        <div class="form-group">
          <label for="signin-email">Email</label>
          <input id="signin-email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="signin-pass">Password</label>
          <input id="signin-pass" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <div class="login-switch" style="margin-top:1rem">
        <a onclick="goStep('step-picker')">&larr; Back</a> &nbsp;&middot;&nbsp;
        <a onclick="goStep('step-register')">Create account</a>
      </div>
    </div>

    <!-- Step 3: Register -->
    <div id="step-register" class="login-step">
      <h2>Create account</h2>
      <p>Join the Lunara community</p>
      <form id="registerForm">
        <div class="form-group">
          <label for="reg-name">Display Name</label>
          <input id="reg-name" name="name" type="text" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input id="reg-email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="reg-pass">Password</label>
          <input id="reg-pass" name="password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
      <div class="login-switch" style="margin-top:1rem">
        Already have an account? <a onclick="goStep('step-signin')">Sign in</a>
      </div>
    </div>

  </div><!-- /login-right -->
</div><!-- /login-page -->

<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
